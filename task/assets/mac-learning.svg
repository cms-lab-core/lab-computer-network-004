<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d">
<title id="t">Почему unknown unicast flood превращается в known unicast forwarding</title>
<desc id="d">Анимация повторяет три стадии: незнакомый destination flood на pc2 и pc3; source MAC ответа pc2 выучен; следующие кадры идут только через eth2. Изначальный кадр и подписи читаемы без анимации.</desc>
<rect width="1600" height="980" fill="#fff"/>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18263d}
.title{font-size:36px;font-weight:bold}.subtitle{font-size:19px;fill:#53647a}
.node{fill:#f6f9ff;stroke:#315dd5;stroke-width:3}.switch{fill:#edf7f3;stroke:#238269;stroke-width:3}
.name{font-size:26px;font-weight:bold}.mono{font:18px DejaVu Sans Mono,monospace}
.small{font-size:18px;fill:#526279}.wire{stroke:#9caabc;stroke-width:7;stroke-linecap:round}
.flood{stroke:#e8a344;stroke-width:8;stroke-linecap:round;stroke-dasharray:12 10}
.direct{stroke:#28856c;stroke-width:9;stroke-linecap:round}
.ph{fill:#fff;stroke:#ccd5e0;stroke-width:2}.phtext{font-size:23px;font-weight:bold}
.mutebg{fill:#f5f8fb}.ball{fill:#e8a344}.ball2{fill:#28856c}
.p1{animation:p1 12s infinite}.p2{animation:p2 12s infinite}.p3{animation:p3 12s infinite}
.dotFlood{animation:dotFlood 12s infinite}.dotDirect{animation:dotDirect 12s infinite}
@keyframes p1{0%,27%{opacity:1}30%,97%{opacity:.14}100%{opacity:1}}
@keyframes p2{0%,27%{opacity:.14}30%,57%{opacity:1}60%,100%{opacity:.14}}
@keyframes p3{0%,57%{opacity:.14}60%,95%{opacity:1}98%,100%{opacity:.14}}
@keyframes dotFlood{0%,12%{opacity:0;transform:translateY(0)}16%{opacity:1;transform:translateY(0)}29%{opacity:1;transform:translateY(115px)}30%,100%{opacity:0;transform:translateY(115px)}}
@keyframes dotDirect{0%,58%{opacity:0;transform:translateX(0)}62%{opacity:1;transform:translateX(0)}82%{opacity:1;transform:translateX(195px)}85%,100%{opacity:0;transform:translateX(195px)}}
</style>
<text class="title" x="800" y="55" text-anchor="middle">Source learning превращает flooding в точную пересылку</text>
<text class="subtitle" x="800" y="94" text-anchor="middle">Сравните входящий source MAC, запись FDB и выходные порты — это три части одного решения switch</text>

<line class="wire" x1="405" y1="305" x2="632" y2="305"/>
<line class="wire" x1="965" y1="305" x2="1195" y2="305"/>
<line class="wire" x1="800" y1="407" x2="800" y2="550"/>
<line class="flood p1" x1="975" y1="286" x2="1185" y2="286"/>
<line class="flood p1" x1="823" y1="422" x2="823" y2="545"/>
<line class="direct p3" x1="975" y1="319" x2="1185" y2="319"/>
<circle class="ball dotFlood" cx="823" cy="425" r="13"/>
<circle class="ball2 dotDirect" cx="980" cy="319" r="13"/>

<rect class="node" x="85" y="210" width="320" height="180" rx="25"/>
<text class="name" x="245" y="263" text-anchor="middle">pc1</text>
<text class="mono" x="245" y="309" text-anchor="middle">MAC …04:01</text>
<text class="small" x="245" y="353" text-anchor="middle">кадр → pc2</text>

<rect class="switch" x="632" y="190" width="333" height="217" rx="25"/>
<text class="name" x="800" y="250" text-anchor="middle">sw1 · br0</text>
<text class="mono" x="800" y="298" text-anchor="middle">eth1 · eth2 · eth3</text>
<text class="small" x="800" y="350" text-anchor="middle">FDB: source MAC → порт</text>

<rect class="node" x="1195" y="210" width="320" height="180" rx="25"/>
<text class="name" x="1355" y="263" text-anchor="middle">pc2</text>
<text class="mono" x="1355" y="309" text-anchor="middle">MAC …04:02</text>
<text class="small" x="1355" y="353" text-anchor="middle">получатель</text>

<rect class="node" x="660" y="550" width="280" height="140" rx="24"/>
<text class="name" x="800" y="603" text-anchor="middle">pc3</text>
<text class="small" x="800" y="643" text-anchor="middle">наблюдает flooding</text>

<rect class="ph p1" x="70" y="760" width="460" height="180" rx="24"/>
<text class="phtext" x="105" y="801">1 · UNKNOWN</text>
<text class="small" x="105" y="841">Switch знает MAC pc1 → eth1,</text>
<text class="small" x="105" y="875">но пока не знает MAC pc2.</text>
<text class="mono" x="105" y="911">flood → eth2 + eth3</text>

<rect class="ph p2" x="570" y="760" width="460" height="180" rx="24"/>
<text class="phtext" x="605" y="801">2 · SOURCE LEARNED</text>
<text class="small" x="605" y="841">Ответ pc2 приходит с eth2.</text>
<text class="small" x="605" y="875">Source MAC записан в FDB:</text>
<text class="mono" x="605" y="911">…04:02 → eth2</text>

<rect class="ph p3" x="1070" y="760" width="460" height="180" rx="24"/>
<text class="phtext" x="1105" y="801">3 · KNOWN UNICAST</text>
<text class="small" x="1105" y="841">Новый кадр для MAC pc2</text>
<text class="small" x="1105" y="875">уходит только на eth2.</text>
<text class="mono" x="1105" y="911">no flood → eth3</text>
</svg>